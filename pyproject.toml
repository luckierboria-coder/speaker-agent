[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speaker-agent"
version = "0.1.0"
description = "Model-neutral engineering tools for loudspeaker driver design and simulation"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "SpeakerAgent contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
